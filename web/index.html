<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lang Travel Map</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="fatal" class="fatal" style="display:none;"></div>

    <main class="layout">
      <section class="map-shell" aria-label="旅行地图">
        <div id="map"></div>
      </section>

      <header class="topbar">
        <div class="brand">
          <h1>Lang Travel</h1>
          <p>地图式周边游玩 Agent</p>
        </div>
        <div class="chips" aria-live="polite">
          <span id="chip-map" class="chip">地图: 初始化中</span>
          <span id="chip-source" class="chip">数据源: local</span>
          <span id="chip-locate" class="chip">定位: 未执行</span>
        </div>
      </header>

      <section class="plan-output-shell" aria-live="polite">
        <pre id="agent-result" class="plan-output"></pre>
      </section>

      <section class="assistant-dock" aria-label="AI 旅行偏好聊天">
        <div id="preference-chat-messages" class="chat-messages"></div>
        <div class="composer">
          <textarea
            id="preference-chat-input"
            class="chat-input"
            rows="1"
            placeholder="告诉我旅行偏好、预算、时间或不想踩的雷"
          ></textarea>
          <div class="composer-actions">
            <button id="btn-preference-chat" type="button" class="btn-secondary">发送</button>
            <button id="btn-agent-plan" type="button" class="btn-primary">一键规划</button>
          </div>
        </div>
      </section>

      <div class="hidden-controls" aria-hidden="true">
        <button id="btn-refresh" type="button">刷新点位</button>
        <input id="ctx-lat" value="31.2304" />
        <input id="ctx-lon" value="121.4737" />
        <input id="ctx-city" value="" />
        <input id="route-hours" value="4" />
        <select id="route-prefer">
          <option value="mixed">mixed</option>
          <option value="park">park</option>
          <option value="attraction">attraction</option>
        </select>
        <input id="agent-days" value="2" />
        <input id="agent-hours" value="6" />
        <input id="agent-budget-total" value="3000" />
        <input id="agent-budget-hotel" value="600" />
        <input id="agent-interests" value="公园,美食,地标" />
        <input id="agent-habits" value="早起,步行可接受,地铁优先" />
        <pre id="route-result"></pre>
        <table>
          <tbody id="place-body"></tbody>
        </table>
      </div>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
